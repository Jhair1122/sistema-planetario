<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Planetario 3D</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Overlay de información del planeta -->
    <div id="planet-overlay" class="hidden">
        <div class="overlay-content">
            <h2 id="planet-name"></h2>
            <p id="planet-phrase"></p>
            <button id="back-button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Regresar
            </button>
        </div>
    </div>

    <!-- Indicador de instrucciones -->
    <div id="instructions">
        <span>🖱️ Gira con el mouse</span>
        <span>🔍 Scroll para zoom</span>
        <span>👆 Clic en un planeta</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
